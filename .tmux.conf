# Prefix ? <- default keybindings
# list-keys <- see cutom keybindings

# Remember that we can reload the config in a session via
# source-file ~/.tmux.conf

# Create a binding to reload off a key:
# I changed capslock to ctrl, capslock is toggled with shift+capslock
# Can also display a message
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"

# Rebinding prefix for less awkward key presses
# May rebind caps lock to ctrl or something
set -g prefix C-a
unbind C-b

# Ensures C-a is sent to other apps, press ctrl-a twice to send to an app running in tmux
bind C-a send-prefix

# Controls delay time when tmux sends commands 
# -s sets tmux server options (which controls all sessions)
# -s can't be overridden in specific sessions, -g can
set -s escape-time 0

# Set base index or windows and panes to 1
set -g base-index 1
set -w -g pane-base-index 1

# Split planes with a better visual representation
bind | split-window -h
bind - split-window -v

# Vim movement through panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# cycle through windows
# -r flag lets us repeatedly tap the key
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Pane resizing with Prefix H, J, K, L
# repeat-time option can ontrol the repeat limit time
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g mouse off

# vi key movement for copy/pasta mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pip-and-cancel 'xclip -in -selection clipboard'

#=======================Visuals==============================#

# Use command to determine the number of colors supported by terminal session
# $ tput colors
# if not 256 - figure out how to configure terminal's 256 mode
set -g default-terminal "tmux-256color"

# note macs may have some annoyance with ncurses - look into screen-256 color instead

# Fedora - Some junk here to fix ptyxis colors
# Tell tmux the outer terminal (Ptyxis) can do 24-bit color. terminal-features
# is matched against the OUTER $TERM, not default-terminal above.
set -as terminal-features ",xterm-256color:RGB"

# small shell script to display a color palette
# for i in {0..255} ; do
#   printf "\x1b[38;5;${i}m${i} "
# done

# Status styling
set -g status-style 'fg=color214,bg=color234' # status bar
set -g window-status-style 'fg=color214,bg=color234' # window list
set -g window-status-current-style "fg=color234,bold,bg=color214" # current window

# Pane styling
set -w -g pane-border-style 'fg=color208,bg=color234' # pane border color
set -w -g pane-active-border-style 'fg=color234,bg=color214' # active pane border color
set -w -g pane-border-lines double # single, double heavys, simple, number
set -g pane-border-indicators arrows 
set -g pane-border-status bottom

# Dimming effect on non-active panes
set -g window-style 'fg=color239,bg=color235'
set -g window-active-style 'fg=color214,bg=color234'

# tmux Message Area
set -g message-style 'fg=color234,bold,bg=color214'

# Status bar
set -g status on
set -g status-justify centre
set -g status-left "S:#S | W:#I | P:#P"
set -g status-left-length 50
set -g status-right-length 50
set -g status-position top
set -g status-right "BAT: #(cat /sys/class/power_supply/BAT1/capacity)%% | %H:%M | %d-%b"

set -g status-interval 15 # default refresh interval is 15 seconds
set -w -g monitor-activity on
set -w -g visual-activity on
